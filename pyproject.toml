[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-distribution-studio"
version = "0.6.71"
description = "Windows 多主机文件分发与远程部署工作台"
requires-python = ">=3.10,<3.15"
dependencies = [
  "PySide6>=6.7,<7",
  "paramiko>=3.4,<5",
  "psutil>=6,<8",
  "pywinrm>=0.5,<1",
  "impacket>=0.13,<0.14",
]
